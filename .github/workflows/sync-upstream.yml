name: Sync upstream skills

# 每周拉取 skills.json 中各上游的最新提交，
# 有变化时同步到 vendor/ 并直接提交回本仓库。
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync vendor/ from upstream
        run: python3 scripts/sync-upstream.py

      - name: Check
        run: scripts/check.sh

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- vendor skills.lock.json)" ]; then
            echo "上游无变化"
            exit 0
          fi
          summary=$(python3 -c 'import json; d=json.load(open("skills.lock.json"))["upstreams"]; print(", ".join(f"{k}@{v["commit"][:7]}" for k, v in d.items()))')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor skills.lock.json
          git commit -m "chore(skills): sync upstream ($summary)"
          git push
